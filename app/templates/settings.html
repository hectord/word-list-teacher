{% extends "base.html" %}

{% block title %}Settings{% endblock %}

{% block header %}
    <link rel="stylesheet" href="/static/pages.css?v=14">
{% endblock %}

{% block body %}

  <header class="page-header">
    <div class="brand-line">
      <a class="back" href="/index">&larr; All vocabularies</a>
      <h1>Settings</h1>
      <span class="subtitle">how words are selected for your runs</span>
    </div>
  </header>

  <div class="center">

    <form class="settings-form" method="post" action="/settings">
      <div class="vocabulary">
        <div class="voc-top">
          <span class="voc-name">Selection strategy</span>
        </div>

        <div class="setting-options">
          {% for option in strategies %}
            <div class="setting-option{% if option == 'ai' %} with-controls{% endif %}">
              <input type="radio" name="strategy" value="{{ option }}"
                     id="strategy-{{ option }}"
                     {% if user.strategy == option %}checked{% endif %}>
              <label class="setting-text" for="strategy-{{ option }}">
                <span class="setting-name">
                  {{ 'full' if option == 'full' else 'ai' }}
                  {% if option == 'full' %}<span class="setting-note">(default)</span>{% endif %}
                </span>
                {% if option == 'full' %}
                  <span class="setting-description">
                    The historical behaviour: words are picked at random among
                    the remaining words, skipping the most recently tried ones.
                  </span>
                {% else %}
                  <span class="setting-description">
                    The AI strategy: words are ranked by a recency-weighted
                    understanding model and picked with weighted randomness.
                  </span>
                {% endif %}
              </label>

              {% if option == 'ai' %}
                <span class="wpr-controls">
                  <label class="wpr-unlimited">
                    <input type="checkbox" id="wpr-unlimited" name="unlimited"
                           {% if user.words_per_run == 0 %}checked{% endif %}>
                    Unlimited
                  </label>
                  <input type="number" name="words_per_run" min="1"
                         value="{{ user.words_per_run or 30 }}"
                         {% if user.words_per_run == 0 %}disabled{% endif %}>
                </span>
              {% endif %}
            </div>
          {% endfor %}
        </div>

        <div class="voc-actions">
          <button class="button" type="submit">Save</button>
        </div>
      </div>
    </form>

    <script>
      (function () {
        var box = document.getElementById('wpr-unlimited');
        var number = document.querySelector('input[name="words_per_run"]');
        function sync() { number.disabled = box.checked; }
        box.addEventListener('change', sync);
      })();
    </script>

  </div>

{% endblock %}
